<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#ECE9E2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;color:#1C1B19;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(700px 420px at 50% 75%,#F7F5F0 0,rgba(247,245,240,0) 75%)}
.lines{position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 31px,rgba(47,125,79,.07) 31px 32px)}
.top{position:absolute;left:0;right:0;top:40px;display:flex;flex-direction:column;align-items:center;text-align:center}
.row{display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:44px;filter:drop-shadow(0 4px 10px rgba(30,24,10,.15))}
.brand span{font-family:ui-serif,"New York",Georgia,serif;font-size:32px;font-weight:600;letter-spacing:-.01em}
.badge{background:#2F7D4F;color:#fff;font-weight:650;font-size:16px;padding:8px 15px;border-radius:999px;box-shadow:0 6px 18px rgba(47,125,79,.25)}
h1{font-family:ui-serif,"New York",Georgia,serif;font-size:56px;line-height:1.04;font-weight:600;letter-spacing:-.02em;margin-top:22px}
.sub{margin-top:12px;font-size:21px;color:#2F7D4F;font-weight:550}
.device{position:absolute;left:50%;top:296px;width:780px;height:560px;transform:translateX(-50%);border-radius:34px;background:#1C1B19;padding:14px;box-shadow:0 2px 4px rgba(30,24,10,.08),0 30px 70px rgba(30,24,10,.25)}
.screen{width:100%;height:100%;border-radius:22px;overflow:hidden;background:#FFFDF8 url(notebook.png) no-repeat;background-size:1040px auto;background-position:-140px -50px}
.pen{position:absolute;right:150px;top:300px;width:22px;height:340px;border-radius:11px;background:linear-gradient(90deg,#d9d6cf,#fbfaf7 45%,#cfccc4);transform:rotate(28deg);box-shadow:0 18px 30px rgba(30,24,10,.2)}
.pen:after{content:"";position:absolute;left:3px;bottom:-26px;border-left:8px solid transparent;border-right:8px solid transparent;border-top:28px solid #e6e3dc}
</style></head><body><div class="bg"></div><div class="lines"></div>
<div class="top">
  <div class="row">
    <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2F7D4F"/><rect x="15" y="10" width="34" height="44" rx="4" fill="#FFFDF8"/><path d="M22 37c5-11 9-11 11-3s6 6 10-7" fill="none" stroke="#1F1F1F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="18" r="1.8" fill="#2F7D4F"/><circle cx="20" cy="46" r="1.8" fill="#2F7D4F"/></svg><span>Looseleaf</span></div>
    <div class="badge">Free Goodnotes alternative</div>
  </div>
  <h1>Handwritten notes for<br>iPad and Apple&nbsp;Pencil.</h1>
  <p class="sub">Runs in your browser. Nothing to install, no account.</p>
</div>
<div class="device"><div class="screen"></div></div>
</body></html>
